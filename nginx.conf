# nginx.conf — the container's entire runtime config: one server, one document root,
# no proxying, no second vhost. Written from scratch instead of extending the base
# image's conf.d so there is exactly one place that says how this site is served.

# No `user nginx;` here, unlike the stock config: that directive only means something
# to a root master process picking a worker's uid, and this image is already running
# as nginx (see the Dockerfile).

worker_processes auto;

# Stock is /run/nginx.pid, and /run is root-owned in the base image while the master
# here is not — so the pid file needs a path that is guaranteed writable.
pid /tmp/nginx.pid;

# Logs go to the container's own streams rather than files under /var/log, so
# `docker logs` is the whole story and nothing accumulates on the writable layer.
error_log /dev/stderr warn;

events {
  # A static host for a two-player hot-seat game: no upstreams, no request bodies,
  # and no concurrency worth tuning for.
  worker_connections 512;
}

http {
  # Real MIME types are the one thing a browser will not forgive. The base image's
  # mime.types already maps .html, .css, .js and .svg correctly (`application/javascript`
  # for js, `image/svg+xml` for svg), so this includes it rather than re-listing a
  # subset — a hand-written list would quietly turn anything new into a download.
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Static files, straight from the page cache.
  sendfile on;

  # A version banner on error pages and in the Server header is free reconnaissance
  # for nobody's benefit.
  server_tokens off;

  # The page is ~30 KB of markup and a few hundred KB of unminified CSS/JS, served to
  # a browser with nothing else to do while it waits. Text only: there are no binary
  # assets here at all, and text/html is compressed by nginx whenever gzip is on, so
  # it needs no entry below.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types text/css text/javascript application/javascript image/svg+xml application/json;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # index.html is the one file that must never be stale: it carries the build's
    # version tag and names whichever css/js this build shipped. `no-cache` is not
    # `no-store` — the browser may keep its copy but has to revalidate before using
    # it, so a repeat visit costs a 304 instead of the whole page re-downloaded.
    # No `always` flag on either of these two headers, deliberately: that would apply
    # them to error responses too, caching a 404 as if it were the real asset.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # style.css and js/*.js are versioned in the page, not in their own names — the
    # URLs are byte-identical from one release to the next. That rules out a long
    # `immutable` TTL, which would strand returning players on last build's code with
    # no way to expire it. An hour covers a session's page loads and still lets a
    # deploy land without telling anyone to hard-refresh.
    location ~ ^/(css|js)/ {
      add_header Cache-Control "public, max-age=3600";
    }

    # The game has no router, so an unknown path is not a missing asset: it is a stale
    # bookmark, a mistyped link, or a shared URL with an extra segment on the end.
    # The shell is the only page this server has, and serving it means the game still
    # boots (seed box and all) instead of stranding the player on a bare 404.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
